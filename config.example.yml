# CheckCheck configuration template - GENERATED from config.py.
# Regenerate with `./gen_config_docs.sh`; do not edit by hand.
# Copy this to config.yml and fill in the required (Required: True) values. Every setting can
# also be supplied via its environment variable (shown per field below); env vars win over the
# file. A readable walkthrough lives in docs/configuration.md.


# ## APP_NAME - Application name ###
# Type:        str
# Required:    False
# Default:     "CheckCheck"
# Env-var:     'APP_NAME'
# Description: Display name of the instance. Shown in the UI title and used in some log lines.
APP_NAME: CheckCheck

# ## LOG_LEVEL - Log level ###
# Type:         Enum
# Required:     False
# Default:      "INFO"
# Allowed vals: ['CRITICAL', 'ERROR', 'WARNING', 'INFO', 'DEBUG']
# Env-var:      'LOG_LEVEL'
# Description:  How much the server logs. `DEBUG` is noisy but the quickest way to see why something misbehaves; `INFO` is the sensible default for production.
LOG_LEVEL: INFO

# ## SERVER_BIND_HOST - Bind host ###
# Type:        str
# Required:    False
# Default:     "localhost"
# Env-var:     'SERVER_BIND_HOST'
# Description: The network interface the server process binds to (internal). Use `0.0.0.0` to accept connections from outside the machine - this is the default inside the Docker image, and the right value when a reverse proxy on another host or container connects to it. `localhost` accepts local connections only.
# Example No. 1:
#  >SERVER_BIND_HOST: 0.0.0.0
# Example No. 2:
#  >SERVER_BIND_HOST: localhost
# Example No. 3:
#  >SERVER_BIND_HOST: 127.0.0.1
SERVER_BIND_HOST: localhost

# ## SERVER_BIND_PORT - Bind port ###
# Type:        int
# Required:    False
# Default:     8181
# Env-var:     'SERVER_BIND_PORT'
# Description: The TCP port the server process binds to (internal).
# Example No. 1:
#  >SERVER_BIND_PORT: 8181
# Example No. 2:
#  >SERVER_BIND_PORT: 8080
# Example No. 3:
#  >SERVER_BIND_PORT: 80
SERVER_BIND_PORT: 8181

# ## SERVER_PUBLIC_URL - Public base URL ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'SERVER_PUBLIC_URL'
# Description: The full external base URL where users reach the app, scheme included, e.g. `https://checklists.example.com`. This is the single source of truth for every absolute URL the server builds (OIDC redirect URIs, the allowed CORS origin) and for whether the session cookie is marked Secure. Set it explicitly in production - behind a reverse proxy the app cannot reliably infer its own external scheme, host or port from forwarded headers. Include a port only if the app is reached on a non-standard one (`https://host:8443`); do not include a path. When left unset it falls back to a URL built from the bind host/port, which is fine for local development only.
# Example No. 1:
#  >SERVER_PUBLIC_URL: https://checklists.example.com
# Example No. 2:
#  >SERVER_PUBLIC_URL: http://localhost:8181
SERVER_PUBLIC_URL: http://localhost:8181

# ## SERVER_TRUSTED_PROXIES - Trusted proxy IPs for forwarded headers ###
# Type:        str
# Required:    False
# Default:     "*"
# Env-var:     'SERVER_TRUSTED_PROXIES'
# Description: Comma-separated list of upstream IPs allowed to set `X-Forwarded-*` headers (proto/host/for), or `*` to trust every upstream. Controls whose forwarded headers uvicorn honours for the client IP and request scheme. The app is designed to run behind a reverse proxy (e.g. Traefik) reachable only on an internal network, so this defaults to `*`. Security note: the security-critical absolute URLs (OIDC redirect) are built from SERVER_PUBLIC_URL, not from these headers, so a spoofed header cannot redirect a login elsewhere. Narrow this to your proxy's IP if the container is ever reachable directly.
SERVER_TRUSTED_PROXIES: '*'

# ## SQL_DATABASE_URL - Database URL ###
# Type:        str
# Required:    False
# Default:     "sqlite+aiosqlite:///./local.sqlite"
# Env-var:     'SQL_DATABASE_URL'
# Description: SQLAlchemy async connection URL. PostgreSQL is the supported production backend; SQLite is fine for local development and single-process use only. See `docs/deployment.md` for why (SSE fan-out is single-process on SQLite).
# Example No. 1:
#  >SQL_DATABASE_URL: sqlite+aiosqlite:///./local.sqlite
# Example No. 2:
#  >SQL_DATABASE_URL: postgresql+asyncpg://checkcheck:secret@localhost:5432/checkcheck
SQL_DATABASE_URL: sqlite+aiosqlite:///./local.sqlite

# ## ADMIN_USER_NAME - Admin username ###
# Type:        str
# Required:    False
# Default:     "admin"
# Env-var:     'ADMIN_USER_NAME'
# Description: Username of the built-in administrator account created on first start.
ADMIN_USER_NAME: admin

# ## ADMIN_USER_PW - Admin password ###
# Type:        Object
# Required:    True
# Env-var:     'ADMIN_USER_PW'
# Description: Password for the built-in administrator account. Required. This is your first way into a fresh instance; change it after logging in and never commit it. The value is only used to create or reset the admin account on start.
ADMIN_USER_PW:
  CHANGE_ME_generate_a_long_random_string_at_least_64_characters_long

# ## ADMIN_USER_EMAIL - Admin email ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'ADMIN_USER_EMAIL'
# Description: Optional email address for the built-in administrator account.
# Example:
#  >ADMIN_USER_EMAIL: admin@example.com
ADMIN_USER_EMAIL:

# ## SERVER_SESSION_SECRET - Session secret ###
# Type:        Object
# Required:    True
# Constraints: MinLen(min_length=64)
# Env-var:     'SERVER_SESSION_SECRET'
# Description: Secret used to sign the browser session cookie. Provide a long random string and keep it stable: changing it logs everyone out. Required, minimum 64 characters. Generate one with `openssl rand -hex 32`.
SERVER_SESSION_SECRET:
  CHANGE_ME_generate_a_long_random_string_at_least_64_characters_long

# ## AUTH_JWT_SECRET - JWT signing secret ###
# Type:        Object
# Required:    True
# Constraints: MinLen(min_length=64)
# Env-var:     'AUTH_JWT_SECRET'
# Description: Secret used to sign API access tokens (JWT). Provide a long random string, keep it stable, and keep it different from SERVER_SESSION_SECRET. Required, minimum 64 characters. Generate one with `openssl rand -hex 32`.
AUTH_JWT_SECRET:
  CHANGE_ME_generate_a_long_random_string_at_least_64_characters_long

# ## AUTH_BASIC_SESSION_LIFETIME_MINUTES - Local session lifetime (minutes) ###
# Type:        int
# Required:    False
# Default:     20160
# Env-var:     'AUTH_BASIC_SESSION_LIFETIME_MINUTES'
# Description: How long a browser session stays valid before the user must log in again. Default is two weeks.
# Example No. 1:
#  >AUTH_BASIC_SESSION_LIFETIME_MINUTES: 20160
# Example No. 2:
#  >AUTH_BASIC_SESSION_LIFETIME_MINUTES: 1440
AUTH_BASIC_SESSION_LIFETIME_MINUTES: 20160

# ## API_TOKEN_DEFAULT_EXPIRY_TIME_MINUTES - Default API token lifetime (minutes) ###
# Type:        int
# Required:    False
# Default:     10080
# Env-var:     'API_TOKEN_DEFAULT_EXPIRY_TIME_MINUTES'
# Description: How long a newly created API token stays valid. Applies to the token minted on login and to tokens created in the token manager. Set to null for no default expiry.
# Example No. 1:
#  >API_TOKEN_DEFAULT_EXPIRY_TIME_MINUTES: 10080
# Example No. 2:
#  >API_TOKEN_DEFAULT_EXPIRY_TIME_MINUTES: 43200
API_TOKEN_DEFAULT_EXPIRY_TIME_MINUTES: 10080

# ## API_TOKEN_ALLOW_NEVER_EXPIRE - Allow never-expiring API tokens ###
# Type:        bool
# Required:    False
# Default:     true
# Env-var:     'API_TOKEN_ALLOW_NEVER_EXPIRE'
# Description: Whether users may create API tokens that never expire. When false, every token must carry an expiry: the 'Never' option is hidden in the UI and rejected by the server.
API_TOKEN_ALLOW_NEVER_EXPIRE: true

# ## SHARING_ENABLED - Enable sharing ###
# Type:        bool
# Required:    False
# Default:     true
# Env-var:     'SHARING_ENABLED'
# Description: Master switch for the sharing feature (collaborators and public links). When false, all sharing endpoints are disabled.
SHARING_ENABLED: true

# ## SHARING_USER_SEARCH_ENABLED - Enable user search when sharing ###
# Type:        bool
# Required:    False
# Default:     true
# Env-var:     'SHARING_USER_SEARCH_ENABLED'
# Description: Allow signed-in users to search for other users by name when choosing who to share with. When false the search endpoint is disabled and a sharer must type an exact identifier.
SHARING_USER_SEARCH_ENABLED: true

# ## SHARING_PUBLIC_LINKS_ENABLED - Enable public share links ###
# Type:        bool
# Required:    False
# Default:     true
# Env-var:     'SHARING_PUBLIC_LINKS_ENABLED'
# Description: Allow owners to create public URLs that let anyone with the link open a card without an account. When false, public-link endpoints are disabled.
SHARING_PUBLIC_LINKS_ENABLED: true

# ## SHARING_REQUIRE_INVITE_ACCEPT - Require invite acceptance ###
# Type:        bool
# Required:    False
# Default:     false
# Env-var:     'SHARING_REQUIRE_INVITE_ACCEPT'
# Description: When true, sharing a card creates a pending invite that the recipient must accept before the card appears for them. When false, sharing adds the collaborator immediately.
SHARING_REQUIRE_INVITE_ACCEPT: false

# ## SHARING_PUBLIC_LINK_EMAIL_ENABLED - Allow mailing a public link ###
# Type:        bool
# Required:    False
# Default:     false
# Env-var:     'SHARING_PUBLIC_LINK_EMAIL_ENABLED'
# Description: Allow a card owner to send an existing public share link to an arbitrary email address from inside the app. Off by default: it lets signed-in users make the server send mail to addresses of their choosing. Requires EMAIL_ENABLED and SHARING_PUBLIC_LINKS_ENABLED as well.
SHARING_PUBLIC_LINK_EMAIL_ENABLED: false

# ## SHARING_PUBLIC_LINK_EMAIL_MAX_PER_HOUR - Maximum mailed links per sender per hour ###
# Type:        int
# Required:    False
# Default:     10
# Env-var:     'SHARING_PUBLIC_LINK_EMAIL_MAX_PER_HOUR'
# Description: How many public links one signed-in user may mail out per hour. This is the anti-abuse limit on SHARING_PUBLIC_LINK_EMAIL_ENABLED: without it, an account on this server is a mail relay. Set to 0 to allow an unlimited number, which is only sensible on a single-user instance.
SHARING_PUBLIC_LINK_EMAIL_MAX_PER_HOUR: 10

# ## SHARING_INTERNAL_EMAIL_DOMAINS - Email domains that belong to your organisation ###
# Type:        List of str
# Required:    False
# Env-var:     'SHARING_INTERNAL_EMAIL_DOMAINS'
# Description: Domains whose addresses probably belong to people who already have an account here. When someone types such an address into 'send this link to someone without an account', the client points out that adding them as a collaborator is probably what was meant. It is only a hint: sending the link anyway is always allowed, since a colleague's private address or a device they are not signed in on is a real case. Compared bare and case-insensitively, subdomains included, so `example.com` also matches `alice@mail.example.com`. Empty by default, which means the hint never appears.
# Example:
#  >SHARING_INTERNAL_EMAIL_DOMAINS:
#  >- example.com
#  >- example.org
SHARING_INTERNAL_EMAIL_DOMAINS: []

# ## EMAIL_ENABLED - Enable email sending ###
# Type:        bool
# Required:    False
# Default:     false
# Env-var:     'EMAIL_ENABLED'
# Description: Master switch for outgoing email. When false the server never sends a message and the email column of the notification settings is hidden in the UI. When true, EMAIL_FROM_ADDRESS is required (and EMAIL_SMTP_HOST for the `smtp` transport), checked at startup.
EMAIL_ENABLED: false

# ## EMAIL_TRANSPORT - Email transport ###
# Type:         Enum
# Required:     False
# Default:      "smtp"
# Allowed vals: ['smtp', 'console', 'file', 'null']
# Env-var:      'EMAIL_TRANSPORT'
# Description:  How messages leave the server. `smtp` talks to a real mail server and is the only production choice. `console` writes the whole message to the log, `file` drops it as an `.eml` file into EMAIL_FILE_TRANSPORT_DIR (open it with any mail client), and `null` discards it. The last three exist so local development and automated tests never need a mail server.
# Example No. 1:
#  >EMAIL_TRANSPORT: smtp
# Example No. 2:
#  >EMAIL_TRANSPORT: console
# Example No. 3:
#  >EMAIL_TRANSPORT: file
# Example No. 4:
#  >EMAIL_TRANSPORT: 'null'
EMAIL_TRANSPORT: smtp

# ## EMAIL_SMTP_HOST - SMTP host ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'EMAIL_SMTP_HOST'
# Description: Hostname of the mail server to hand messages to. Required when EMAIL_ENABLED is true and EMAIL_TRANSPORT is `smtp`.
# Example No. 1:
#  >EMAIL_SMTP_HOST: smtp.example.com
# Example No. 2:
#  >EMAIL_SMTP_HOST: localhost
EMAIL_SMTP_HOST:

# ## EMAIL_SMTP_PORT - SMTP port ###
# Type:        int
# Required:    False
# Default:     587
# Env-var:     'EMAIL_SMTP_PORT'
# Description: Port of the mail server. 587 is the usual submission port (with STARTTLS), 465 the implicit-TLS one (use EMAIL_SMTP_SECURITY `ssl`), 25 plain relay on a trusted network.
# Example No. 1:
#  >EMAIL_SMTP_PORT: 587
# Example No. 2:
#  >EMAIL_SMTP_PORT: 465
# Example No. 3:
#  >EMAIL_SMTP_PORT: 25
EMAIL_SMTP_PORT: 587

# ## EMAIL_SMTP_USER - SMTP username ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'EMAIL_SMTP_USER'
# Description: Username for SMTP authentication. Leave unset for a relay that needs no login.
EMAIL_SMTP_USER:

# ## EMAIL_SMTP_PASSWORD - SMTP password ###
# Type:        Object
# Required:    False
# Default:     null
# Env-var:     'EMAIL_SMTP_PASSWORD'
# Description: Password for SMTP authentication. Only used together with EMAIL_SMTP_USER. Supply it through the environment rather than committing it to a config file.
EMAIL_SMTP_PASSWORD:

# ## EMAIL_SMTP_SECURITY - SMTP connection security ###
# Type:         Enum
# Required:     False
# Default:      "starttls"
# Allowed vals: ['starttls', 'ssl', 'none']
# Env-var:      'EMAIL_SMTP_SECURITY'
# Description:  How the connection to the mail server is encrypted. `starttls` connects in plain text and upgrades (the normal choice for port 587), `ssl` is TLS from the first byte (port 465), `none` is unencrypted and only acceptable for a mail server on localhost or a trusted private network.
# Example No. 1:
#  >EMAIL_SMTP_SECURITY: starttls
# Example No. 2:
#  >EMAIL_SMTP_SECURITY: ssl
# Example No. 3:
#  >EMAIL_SMTP_SECURITY: none
EMAIL_SMTP_SECURITY: starttls

# ## EMAIL_FROM_ADDRESS - Sender address ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'EMAIL_FROM_ADDRESS'
# Description: The address every message is sent from. Required when EMAIL_ENABLED is true, checked at startup. Use an address the mail server is actually allowed to send as, otherwise messages get rejected or land in spam.
# Example No. 1:
#  >EMAIL_FROM_ADDRESS: checkcheck@example.com
# Example No. 2:
#  >EMAIL_FROM_ADDRESS: no-reply@example.com
EMAIL_FROM_ADDRESS:

# ## EMAIL_FROM_NAME - Sender display name ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'EMAIL_FROM_NAME'
# Description: The human-readable name shown next to the sender address. Falls back to APP_NAME when unset.
# Example No. 1:
#  >EMAIL_FROM_NAME: CheckCheck
# Example No. 2:
#  >EMAIL_FROM_NAME: My Checklists
EMAIL_FROM_NAME: CheckCheck

# ## EMAIL_REPLY_TO - Reply-To address ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'EMAIL_REPLY_TO'
# Description: Optional address replies should go to. Set it to a monitored mailbox when EMAIL_FROM_ADDRESS is a no-reply one; leave unset to omit the header.
# Example:
#  >EMAIL_REPLY_TO: support@example.com
EMAIL_REPLY_TO:

# ## EMAIL_FILE_TRANSPORT_DIR - Directory for the file transport ###
# Type:        str
# Required:    False
# Default:     "./dev_mail"
# Env-var:     'EMAIL_FILE_TRANSPORT_DIR'
# Description: Where EMAIL_TRANSPORT `file` writes messages as `.eml` files. Created on first use and must be writable by the server process. Ignored by every other transport.
EMAIL_FILE_TRANSPORT_DIR: ./dev_mail

# ## EMAIL_TIMEOUT_SECONDS - SMTP timeout (seconds) ###
# Type:        int
# Required:    False
# Default:     20
# Env-var:     'EMAIL_TIMEOUT_SECONDS'
# Description: How long to wait for the mail server before giving up on a message. The attempt is retried later, so a short timeout is safer than a long stall.
EMAIL_TIMEOUT_SECONDS: 20

# ## EMAIL_TEMPLATE_DIR - Email template override directory ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'EMAIL_TEMPLATE_DIR'
# Description: Directory whose templates take priority over the bundled ones, matched by file name (for example base.html). Any template you do not provide keeps using the bundled version, so overriding just base.html is enough to rebrand every message. Every bundled template name is rendered against a dummy context at startup, from this directory if set, so a broken override fails loudly here rather than at delivery time; an override that only fails on real data is logged and the bundled template is used for that one message instead.
EMAIL_TEMPLATE_DIR:

# ## EMAIL_BRAND_COLOR - Brand colour ###
# Type:        str
# Required:    False
# Default:     "#059669"
# Env-var:     'EMAIL_BRAND_COLOR'
# Description: Header and button colour for outgoing email and the unsubscribe page. A hex triplet such as #059669, validated at startup because it is interpolated straight into the message markup. The header text and button label colour (black or white) is chosen automatically for contrast against it.
# Example No. 1:
#  >EMAIL_BRAND_COLOR: '#059669'
# Example No. 2:
#  >EMAIL_BRAND_COLOR: '#1d4ed8'
EMAIL_BRAND_COLOR: '#059669'

# ## EMAIL_LOGO_URL - Logo URL ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'EMAIL_LOGO_URL'
# Description: Absolute http(s) URL of a logo shown in the header of outgoing email and the unsubscribe page. Unset shows a text wordmark instead, which is the default for two reasons: most mail clients block remote images until the reader allows them, so the design has to work without one anyway, and a remote logo is fetched by the recipient's own mail client, which tells this instance when a message was opened. That is your own choice to make about your own users, but the public-link invitation goes to people who never signed up here, so weigh that before setting this.
# Example:
#  >EMAIL_LOGO_URL: https://example.com/logo.png
EMAIL_LOGO_URL:

# ## NOTIFY_EMAIL_REQUIRE_VERIFIED - Only mail verified addresses ###
# Type:        bool
# Required:    False
# Default:     false
# Env-var:     'NOTIFY_EMAIL_REQUIRE_VERIFIED'
# Description: When true, a user whose address is not marked verified receives no mail. Off by default because in a self-hosted instance addresses come from the identity provider or an administrator and are already trusted. There is no verification flow yet, so turning this on currently stops all mail.
NOTIFY_EMAIL_REQUIRE_VERIFIED: false

# ## NOTIFY_EMAIL_CONTENT_MODE - How much email messages reveal ###
# Type:         Enum
# Required:     False
# Default:      "full"
# Allowed vals: ['full', 'minimal']
# Env-var:      'NOTIFY_EMAIL_CONTENT_MODE'
# Description:  `full` names the card and the person who acted, which makes the message useful on its own. `minimal` only says that something happened and links back to the app. Mail leaves the instance and is stored on someone else's server, so pick `minimal` when card names are sensitive.
# Example No. 1:
#  >NOTIFY_EMAIL_CONTENT_MODE: full
# Example No. 2:
#  >NOTIFY_EMAIL_CONTENT_MODE: minimal
NOTIFY_EMAIL_CONTENT_MODE: full

# ## NOTIFY_EMAIL_SUPPRESS_WINDOW_SECONDS - Delay before an immediate mail goes out (seconds) ###
# Type:        int
# Required:    False
# Default:     120
# Env-var:     'NOTIFY_EMAIL_SUPPRESS_WINDOW_SECONDS'
# Description: How long a message waits before being sent. If the user reads the notification in the app within that window, no mail is sent at all. Keeps people who are looking at the app right now out of their own inbox. Set to 0 to send without delay.
NOTIFY_EMAIL_SUPPRESS_WINDOW_SECONDS: 120

# ## NOTIFY_DEFAULT_MODES - Instance default notification modes ###
# Type:        Dictionary of (str, Dictionary of (str, str))
# Required:    False
# Env-var:     'NOTIFY_DEFAULT_MODES'
# Description: The delivery mode used for a notification type and channel when the user has not chosen one. Keyed by notification type (`card_shared`, `card_invited`, `public_link_opened`, `reminder_due`), then by channel (`in_app`, `email`, `webhook`). Modes are `off`, `immediate`, `hourly` and `daily`; `in_app` and `webhook` accept only `off` and `immediate`. Users can override every entry unless it is listed in NOTIFY_DISABLED_TYPES.
# Example:
#  >NOTIFY_DEFAULT_MODES:
#  >  card_shared:
#  >    in_app: immediate
#  >    email: immediate
#  >  card_invited:
#  >    in_app: immediate
#  >    email: immediate
#  >  public_link_opened:
#  >    in_app: immediate
#  >    email: 'off'
#  >  reminder_due:
#  >    in_app: immediate
#  >    email: immediate
NOTIFY_DEFAULT_MODES:

  # ## card_shared ###
  # YAML-path: NOTIFY_DEFAULT_MODES.['card_shared']
  # Type:      Dictionary of (str, str)
  # Required:  True
  # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>'
  card_shared:

    # ## in_app ###
    # YAML-path: NOTIFY_DEFAULT_MODES.['card_shared'].['in_app']
    # Type:      str
    # Required:  True
    # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>__<dict-key>'
    in_app: immediate

    # ## email ###
    # YAML-path: NOTIFY_DEFAULT_MODES.['card_shared'].['email']
    # Type:      str
    # Required:  True
    # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>__<dict-key>'
    email: immediate

  # ## card_invited ###
  # YAML-path: NOTIFY_DEFAULT_MODES.['card_invited']
  # Type:      Dictionary of (str, str)
  # Required:  True
  # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>'
  card_invited:

    # ## in_app ###
    # YAML-path: NOTIFY_DEFAULT_MODES.['card_invited'].['in_app']
    # Type:      str
    # Required:  True
    # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>__<dict-key>'
    in_app: immediate

    # ## email ###
    # YAML-path: NOTIFY_DEFAULT_MODES.['card_invited'].['email']
    # Type:      str
    # Required:  True
    # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>__<dict-key>'
    email: immediate

  # ## public_link_opened ###
  # YAML-path: NOTIFY_DEFAULT_MODES.['public_link_opened']
  # Type:      Dictionary of (str, str)
  # Required:  True
  # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>'
  public_link_opened:

    # ## in_app ###
    # YAML-path: NOTIFY_DEFAULT_MODES.['public_link_opened'].['in_app']
    # Type:      str
    # Required:  True
    # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>__<dict-key>'
    in_app: immediate

    # ## email ###
    # YAML-path: NOTIFY_DEFAULT_MODES.['public_link_opened'].['email']
    # Type:      str
    # Required:  True
    # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>__<dict-key>'
    email: immediate

  # ## reminder_due ###
  # YAML-path: NOTIFY_DEFAULT_MODES.['reminder_due']
  # Type:      Dictionary of (str, str)
  # Required:  True
  # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>'
  reminder_due:

    # ## in_app ###
    # YAML-path: NOTIFY_DEFAULT_MODES.['reminder_due'].['in_app']
    # Type:      str
    # Required:  True
    # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>__<dict-key>'
    in_app: immediate

    # ## email ###
    # YAML-path: NOTIFY_DEFAULT_MODES.['reminder_due'].['email']
    # Type:      str
    # Required:  True
    # Env-var:   'NOTIFY_DEFAULT_MODES__<dict-key>__<dict-key>'
    email: immediate

# ## NOTIFY_DISABLED_TYPES - Notification types disabled instance-wide ###
# Type:        List of str
# Required:    False
# Env-var:     'NOTIFY_DISABLED_TYPES'
# Description: Notification types nobody may receive, whatever their personal settings say. Known types are `card_shared`, `card_invited`, `public_link_opened` and `reminder_due`. The settings UI shows those entries as locked by the administrator. Listing `reminder_due` also stops the reminder scan, so due reminders are not delivered on any channel. Empty by default.
# Example:
#  >NOTIFY_DISABLED_TYPES:
#  >- public_link_opened
NOTIFY_DISABLED_TYPES: []

# ## NOTIFY_DISPATCH_IN_PROCESS - Send queued messages from the server process ###
# Type:        bool
# Required:    False
# Default:     true
# Env-var:     'NOTIFY_DISPATCH_IN_PROCESS'
# Description: When true the server itself drains the queue of pending messages in a background task, which is what a normal single-container deployment wants. Turn it off only if something else drains the queue, so that queued messages are not delivered twice.
NOTIFY_DISPATCH_IN_PROCESS: true

# ## NOTIFY_DISPATCH_TICK_SECONDS - Dispatcher tick (seconds) ###
# Type:        int
# Required:    False
# Default:     30
# Env-var:     'NOTIFY_DISPATCH_TICK_SECONDS'
# Description: How often the background sender looks for due messages. It also wakes up immediately when something is queued, so this is only the fallback interval.
NOTIFY_DISPATCH_TICK_SECONDS: 30

# ## NOTIFY_MAX_ATTEMPTS - Delivery attempts before giving up ###
# Type:        int
# Required:    False
# Default:     6
# Env-var:     'NOTIFY_MAX_ATTEMPTS'
# Description: How often a message is retried after a temporary failure (with growing backoff) before it is marked failed and left for inspection. Permanent failures, such as a rejected address, are never retried.
NOTIFY_MAX_ATTEMPTS: 6

# ## NOTIFY_OUTBOX_RETENTION_DAYS - Keep sent messages for (days) ###
# Type:        int
# Required:    False
# Default:     30
# Env-var:     'NOTIFY_OUTBOX_RETENTION_DAYS'
# Description: How long successfully sent rows stay in the outbox table before they are pruned. Failed rows are kept longer so an operator can still see what broke.
NOTIFY_OUTBOX_RETENTION_DAYS: 30

# ## NOTIFY_FEED_RETENTION_DAYS - Keep in-app notifications for (days) ###
# Type:        int
# Required:    False
# Default:     180
# Env-var:     'NOTIFY_FEED_RETENTION_DAYS'
# Description: How long read notifications stay in the in-app feed before they are pruned. The feed grows forever otherwise. Set to 0 to keep everything.
NOTIFY_FEED_RETENTION_DAYS: 180

# ## NOTIFY_EMAIL_MAX_PER_USER_PER_HOUR - Maximum emails per user per hour ###
# Type:        int
# Required:    False
# Default:     20
# Env-var:     'NOTIFY_EMAIL_MAX_PER_USER_PER_HOUR'
# Description: A blunt backstop against flooding a single recipient. Messages over the limit are dropped rather than queued forever.
NOTIFY_EMAIL_MAX_PER_USER_PER_HOUR: 20

# ## NOTIFY_WEBHOOK_ENABLED - Enable per-user webhooks ###
# Type:        bool
# Required:    False
# Default:     false
# Env-var:     'NOTIFY_WEBHOOK_ENABLED'
# Description: Master switch for the webhook channel, which POSTs a small JSON body to a URL each user configures for themselves. Off by default: it lets signed-in users make the server issue outbound HTTP requests.
NOTIFY_WEBHOOK_ENABLED: false

# ## NOTIFY_WEBHOOK_ALLOW_PRIVATE_IPS - Allow webhooks to private addresses ###
# Type:        bool
# Required:    False
# Default:     false
# Env-var:     'NOTIFY_WEBHOOK_ALLOW_PRIVATE_IPS'
# Description: When false, webhook URLs resolving to loopback, link-local or private network ranges are refused, which is what stops a user pointing a webhook at services reachable only from the server. Turn it on only for a trusted, single-user instance on a private network.
NOTIFY_WEBHOOK_ALLOW_PRIVATE_IPS: false

# ## AUTH_BASIC_LOGIN_IS_ENABLED - Enable local login ###
# Type:        bool
# Required:    False
# Default:     true
# Env-var:     'AUTH_BASIC_LOGIN_IS_ENABLED'
# Description: Allow users stored in the local database to log in with a username and password. You can disable this when authenticating exclusively through an external OIDC provider.
AUTH_BASIC_LOGIN_IS_ENABLED: true

# ## AUTH_BASIC_USER_DB_REGISTER_ENABLED - Allow self-registration ###
# Type:        bool
# Required:    False
# Default:     false
# Env-var:     'AUTH_BASIC_USER_DB_REGISTER_ENABLED'
# Description: Allow anyone to create a local account through the public registration endpoint. Off by default. Enable only when you have anti-abuse controls in place, since there is no email verification step yet.
AUTH_BASIC_USER_DB_REGISTER_ENABLED: false

# ## AUTH_OIDC_PROVIDERS - OpenID Connect providers ###
# Type:        List of Object (OpenIDConnectProvider)
# Required:    False
# Env-var:     'AUTH_OIDC_PROVIDERS'
# Description: List of external OpenID Connect providers users may log in with. Empty by default (local login only). One entry per provider; see the example below and the walkthrough in `docs/configuration.md`. When any provider is set, also set AUTH_OIDC_TOKEN_STORAGE_SECRET.
# Example:
#  >AUTH_OIDC_PROVIDERS:
#  >- ENABLED: true
#  >  PROVIDER_DISPLAY_NAME: Company SSO
#  >  CONFIGURATION_ENDPOINT: https://sso.example.com/application/o/checkcheck/.well-known/openid-configuration
#  >  CLIENT_ID: checkcheck
#  >  CLIENT_SECRET: the-client-secret
#  >  SCOPES:
#  >  - openid
#  >  - profile
#  >  - email
#  >  - offline_access
#  >  USER_NAME_ATTRIBUTE: preferred_username
#  >  USER_MAIL_ATTRIBUTE: email
#  >  AUTO_CREATE_AUTHORIZED_USER: true
#  >  ROLE_MAPPING:
#  >    sso-admins:
#  >    - admin
AUTH_OIDC_PROVIDERS: []

# ## AUTH_OIDC_TOKEN_STORAGE_SECRET - OIDC token storage secret ###
# Type:        Object
# Required:    False
# Default:     "change_me_only_relevant_when_an_oidc_provider_is_configured"
# Env-var:     'AUTH_OIDC_TOKEN_STORAGE_SECRET'
# Description: Secret used to encrypt OIDC access and refresh tokens before storing them in the database. Only used when at least one OIDC provider is configured; set a long random string in that case. Generate one with `openssl rand -hex 32`.
AUTH_OIDC_TOKEN_STORAGE_SECRET:
  change_me_only_relevant_when_an_oidc_provider_is_configured

# ## NEW_USER_DEFAULT_LABELS - Default labels for new users ###
# Type:        List of str
# Required:    False
# Default:     ["Work", "Private", "Inspiration"]
# Env-var:     'NEW_USER_DEFAULT_LABELS'
# Description: Labels created automatically for every new account. Set to an empty list to start users with no labels.
# Example No. 1:
#  >NEW_USER_DEFAULT_LABELS:
#  >- Work
#  >- Private
#  >- Inspiration
# Example No. 2:
#  >NEW_USER_DEFAULT_LABELS: []
NEW_USER_DEFAULT_LABELS:

  # ## List[0] ###
  # YAML-path: NEW_USER_DEFAULT_LABELS.[0]
  # Type:      str
  # Required:  False
  # Env-var:   'NEW_USER_DEFAULT_LABELS__<list-index>'
  - Work

  # ## List[1] ###
  # YAML-path: NEW_USER_DEFAULT_LABELS.[1]
  # Type:      str
  # Required:  False
  # Env-var:   'NEW_USER_DEFAULT_LABELS__<list-index>'
  - Private

  # ## List[2] ###
  # YAML-path: NEW_USER_DEFAULT_LABELS.[2]
  # Type:      str
  # Required:  False
  # Env-var:   'NEW_USER_DEFAULT_LABELS__<list-index>'
  - Inspiration

# ## APP_PROVISIONING_DATA_YAML_FILES - Extra provisioning data files ###
# Type:        List of str
# Required:    False
# Env-var:     'APP_PROVISIONING_DATA_YAML_FILES'
# Description: Optional list of YAML files whose contents are loaded into the database on start. Use this to seed an instance with predefined data. Most deployments leave it empty.
# Example:
#  >APP_PROVISIONING_DATA_YAML_FILES:
#  >- /config/seed_data.yaml
APP_PROVISIONING_DATA_YAML_FILES: []

# ## EXPORT_CACHE_DIR - Export cache directory ###
# Type:        str
# Required:    False
# Default:     "./export_cache"
# Env-var:     'EXPORT_CACHE_DIR'
# Description: Directory where the results of export jobs (CSV, JSON) are written. Must be writable by the server process.
EXPORT_CACHE_DIR: ./export_cache

# ## SET_SESSION_COOKIE_SECURE - Secure session cookie ###
# Type:        bool
# Required:    False
# Default:     null
# Env-var:     'SET_SESSION_COOKIE_SECURE'
# Description: When true the session cookie is only sent over HTTPS. Leave unset (the default) to derive it from SERVER_PUBLIC_URL: Secure on an `https` URL, not Secure on `http` (so login works over plain-HTTP localhost without a manual override, and is Secure in production). Set it explicitly only to override that.
SET_SESSION_COOKIE_SECURE: false

# ## CLIENT_URL - Extra allowed origin ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'CLIENT_URL'
# Description: An additional browser origin allowed to call the API (CORS), on top of the server's own URL. Only needed when the frontend is served from a different origin than the backend, for example during frontend development.
# Example:
#  >CLIENT_URL: http://localhost:3000
CLIENT_URL:

# ## DEBUG_SQL - Log SQL statements ###
# Type:        bool
# Required:    False
# Default:     false
# Env-var:     'DEBUG_SQL'
# Description: When true, the database engine prints every SQL query to the log. Very verbose; leave off unless debugging queries.
DEBUG_SQL: false

# ## SERVER_UVICORN_LOG_LEVEL - Uvicorn log level ###
# Type:        str
# Required:    False
# Default:     null
# Env-var:     'SERVER_UVICORN_LOG_LEVEL'
# Description: Log level for the uvicorn web server. Falls back to LOG_LEVEL when unset.
# Example No. 1:
#  >SERVER_UVICORN_LOG_LEVEL: info
# Example No. 2:
#  >SERVER_UVICORN_LOG_LEVEL: warning
SERVER_UVICORN_LOG_LEVEL:

# ## AUTH_JWT_ALGORITHM - JWT algorithm ###
# Type:         Enum
# Required:     False
# Default:      "HS256"
# Allowed vals: ['HS256']
# Env-var:      'AUTH_JWT_ALGORITHM'
# Description:  Algorithm used to sign JWT tokens. Only HS256 is supported at the moment.
AUTH_JWT_ALGORITHM: HS256

# ## AUTH_ACCESS_TOKEN_EXPIRES_MINUTES - Access token lifetime (minutes, deprecated) ###
# Type:        int
# Required:    False
# Default:     20160
# Env-var:     'AUTH_ACCESS_TOKEN_EXPIRES_MINUTES'
# Description: Deprecated. Use API_TOKEN_DEFAULT_EXPIRY_TIME_MINUTES instead.
AUTH_ACCESS_TOKEN_EXPIRES_MINUTES: 20160

# ## ADMIN_ROLE_NAME - Admin role name ###
# Type:        str
# Required:    False
# Default:     "admin"
# Env-var:     'ADMIN_ROLE_NAME'
# Description: Name of the role that grants full administrative access. Rarely needs changing.
ADMIN_ROLE_NAME: admin

# ## USERMANAGER_ROLE_NAME - User-manager role name ###
# Type:        str
# Required:    False
# Default:     "usermanager"
# Env-var:     'USERMANAGER_ROLE_NAME'
# Description: Name of the role that may manage other users without full admin rights. Rarely needs changing.
USERMANAGER_ROLE_NAME: usermanager

# ## APP_PROVISIONING_DEFAULT_DATA_YAML_FILE - Default provisioning data file ###
# Type:        str
# Required:    False
# Default:     "./CheckCheck/backend/checkcheckserver/default_data.yaml"
# Env-var:     'APP_PROVISIONING_DEFAULT_DATA_YAML_FILE'
# Description: Baseline data (roles and similar) always loaded on start. This ships with the app and normally should not be changed. To seed your own data use APP_PROVISIONING_DATA_YAML_FILES instead.
APP_PROVISIONING_DEFAULT_DATA_YAML_FILE:
  ./CheckCheck/backend/checkcheckserver/default_data.yaml

# ## DOCKER_MODE - Running inside the official Docker image ###
# Type:        bool
# Required:    False
# Default:     false
# Env-var:     'DOCKER_MODE'
# Description: Set automatically by the Docker image. Only affects a few path defaults; do not set it by hand outside a container.
DOCKER_MODE: false

# ## FRONTEND_FILES_DIR - Frontend files directory ###
# Type:        str
# Required:    False
# Default:     "CheckCheck/frontend/.output/public"
# Env-var:     'FRONTEND_FILES_DIR'
# Description: Directory of the built frontend (the generated Nuxt output containing index.html). The Docker image sets this for you.
FRONTEND_FILES_DIR: CheckCheck/frontend/.output/public

# ## DB_MIGRATION_ALEMBIC_CONFIG_FILE - Alembic config file ###
# Type:        str
# Required:    False
# Default:     "./alembic.ini"
# Env-var:     'DB_MIGRATION_ALEMBIC_CONFIG_FILE'
# Description: Path to the Alembic configuration used to run database migrations on start. The default resolves next to the source tree; rarely changed.
DB_MIGRATION_ALEMBIC_CONFIG_FILE:
  ./alembic.ini
